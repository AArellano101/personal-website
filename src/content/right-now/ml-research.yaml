content:
  lead_markdown: >-
    In Dr. Samira Kahou's Machine Intelligence and Reasoning Lab, I study
    **multi-agent systems built from large language models**. My research asks
    how we can understand these systems across three complementary levels:
    **what agents do, what they explicitly maintain, and what their underlying
    models represent internally**. I'm interested in AI safety,
    explainability, and their emergent behaviours.

  body_markdown: |-
    My main project is **MOSAIC: Multi-agent Observability for States, Actions,
    Internals, and Comparison**, an experimental framework for configurable,
    multi-turn LLM-based simulations.

    MOSAIC is built around a three-level analytical taxonomy:
    **observable behavior, explicit evolving agent state, and model-internal
    representations**. Observable behavior includes agent messages, actions,
    decisions, outcomes, and interaction trajectories. The explicit agent state
    consists of **beliefs, objectives, and plans** maintained between
    interactions, while model-internal representations include signals such as
    **activations, attention patterns, and probe outputs**.

    A major part of my work involves making these levels observable together.
    MOSAIC allows researchers to examine how changes in **beliefs, objectives,
    and plans propagate onto communication and actions**, while white-box
    measurements provide independent evidence about what may be represented
    internally by the underlying language model.

    The framework also supports controlled manipulation of **seed beliefs,
    plans, objectives, scenario definitions, and private information**. This
    allows matched simulations to be compared across conditions and enables
    safety-relevant phenomena to emerge **without direct behavioral prompting**.

    At the model-internal level, I work with **attention visualization,
    linear probes, and sparse autoencoders**. These measurements are aligned with the same agent, turn,
    response, and evolving state, making it possible to examine **agreement,
    disagreement, and different temporal dynamics** across the three levels of
    analysis.

    Beyond MOSAIC, I'm **writing a chapter on explainable machine learning**,
    have **co-authored a paper on AI safety**, and am currently **contributing
    to a Delphi study on safe agentic AI**. These projects complement my main
    research by extending my work across explainability, AI safety, and the
    broader study of safe autonomous and multi-agent systems.

    I can't reveal too much because much of this work is still unpublished!


