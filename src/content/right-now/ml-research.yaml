content:
  lead_markdown: >-
    In Dr. Samira Kahou's Machine Intelligence and Reasoning Lab, I am studying how groups of
    language-model agents **reason, plan, negotiate, and, on occasion, fail**. I'm interested in how behaviours such as deception, sycophancy, information leakage, or coordination failures become visible
    in their messages. Exploring how an LLM's internal mechanisms can be used to explain **why these behaviours occur** also fascinates me.

  body_markdown: |-
    My main project is twofold. First, I'm building a configurable
    simulator where LLM-based agents interact while maintaining private
    **beliefs, objectives, plans, memory, and roles**.

    The second contribution is explainability. I'm interested in looking inside
    the models instead of judging them only by their final responses, using
    **linear probes, sparse autoencoders, Jacobian lenses, and other white-box 
    approaches**.

    Side projects include writing an online textbook and developing a documentation schema for
    multi-agent systems.

    I can't reveal too much because it's all unpublished work (for now)!

