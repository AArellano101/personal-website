id: "multi-agent-simulator"
title: "MOSAIC: Multi-Agent Observability for LLM Systems"
status: "Active research"
featured: true

summary_markdown: >-
  As **multi-agent large language model (LLM) systems** become increasingly useful for complex
  problem solving, analyzing them becomes difficult because existing approaches are often fragmented
  across different abstraction levels. This project introduces a three-level framework for studying
  **observable behavior, explicit evolving agent state, and model-internal representations** together.

description_markdown: |-
  **LLM-based multi-agent systems** use multiple language-model agents to interact, reason, collaborate,
  negotiate, and make decisions over extended trajectories. These systems are increasingly being explored
  in domains such as healthcare, code generation, robotics, and other complex environments.

  However, analyzing these systems presents a problem: existing approaches often focus on only one or two
  parts of an agent interaction. Some analyze **what agents do**, some inspect **what information or objectives
  they explicitly maintain**, and others investigate **how information is represented internally by the
  underlying language model**.

  My research addresses this fragmentation through **MOSAIC: Multi-agent Observability for States, Actions,
  Internals, and Comparison**, a visual experimental framework for **temporally aligned, configurable,
  multi-turn, multi-agent LLM-based simulations**.

  MOSAIC is organized around a three-level analytical taxonomy:

  1. **Observable Behavior** — agent messages, actions, decisions, outcomes, and interaction trajectories.
  2. **Explicit Agent State** — interpretable beliefs, objectives, and plans that persist and evolve between interactions.
  3. **Model-Internal Representations** — latent signals such as hidden-layer activations, attention patterns, and probe outputs.

  These levels provide **distinct and complementary evidence** about the same interaction. Their alignment
  allows researchers to examine how changes in what an agent believes, wants, or plans relate to its later
  behavior, while also comparing those observations against signals inside the underlying language model.

  A central part of MOSAIC is its **explicit evolving agent state**. Each agent maintains beliefs, objectives,
  and plans that condition future actions. Before generating a new response, the agent performs self-reflection
  over its interaction history and can **add, update, delete, or preserve** entries in this state. This makes it
  possible to trace how an agent's understanding and strategy evolve throughout a simulation.

  MOSAIC also supports **controlled experimentation**. Seed beliefs, objectives, plans, private information,
  agent roles, and scenario conditions can be manipulated between matched runs. Researchers can then trace
  how these changes propagate into later agent states and observable behavior.

  Rather than directly instructing agents to exhibit a target behavior, scenarios can be designed so that
  safety-relevant phenomena emerge from **information asymmetries, incentives, and agent state**. Current
  phenomena include **dishonesty, deception, overconfidence, and reciprocity**.

  At the model-internal level, MOSAIC currently uses **attention analysis and linear probes**. Attention
  visualizations expose token-level patterns across transformer layers and heads, while a trained linear probe
  measures activation-level signals associated with dishonest interactions. These measurements are aligned
  with the same agent, turn, explicit state, and response.

  An external **LLM-as-a-judge** provides another analytical signal by evaluating behaviors using the scenario,
  interaction history, observable response, and explicit agent state. Comparing these evaluations against
  model-internal measurements allows MOSAIC to study not only where the three levels agree, but also where
  they **diverge or evolve differently over time**.

  Current simulations span **negotiation, healthcare coordination, and code review**, while preserving the
  same core architecture across domains.

  Overall, MOSAIC provides a foundation for **systematic, interpretable, and experimentally controlled
  analysis of multi-agent LLM systems**, particularly for behavioral and AI-safety research.

personal_explanation_markdown: >-
  What interests me most is connecting different forms of evidence about the same agent interaction.
  A response may look harmless from the outside while the agent's private state provides additional context,
  or a linear probe may detect a model-internal signal that disagrees with the behavioral evaluation.
  Instead of treating any one measurement as the complete explanation, I want to understand what we can
  learn by **aligning behavior, evolving state, and internal representations over time**.

contributions:
  - "Developed a three-level taxonomy for analyzing multi-agent LLMs across behavior, evolving agent state, and model-internal representations."
  - "Designed MOSAIC, a configurable experimental framework for temporally aligned multi-agent analysis."
  - "Developed methods for eliciting and evaluating safety-relevant behaviors such as dishonesty and deception without direct prompting."
  - "Designed controlled experiments that manipulate agent beliefs, objectives, plans, and private information to trace downstream effects."
  - "Implemented and evaluated white-box analysis using attention measurements and a Qwen 3.5-9B dishonesty linear probe."
