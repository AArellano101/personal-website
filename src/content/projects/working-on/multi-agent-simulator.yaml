id: "multi-agent-simulator"
title: "Multi-Agent Simulator with White-Box Explainability"
status: "Active research"
featured: true

summary_markdown: >-
  The **explainability crisis** describes the growing gap between our use of large language models (LLMs)
  and our understanding of their internal mechanisms. This project aims to improve our understanding of LLMs
  in **multi-agent systems**.

description_markdown: |-
  LLMs built on the **transformer** architecture (the 'T' in ChatGPT) are notorious black boxes, meaning we 
  *don't know with absolute certainty what makes them interpret data*. The contributing factors are:
  1. Massive scale
  2. Data that is not human-interpretable
  3. Complex nonlinear math

  So when LLMs behave in unusual ways (hallucination, overconfidence, deception), we can't completely understand
  what causes these behaviours.

  But this doesn't stop developers and researchers from pushing LLMs to their limits. 

  **LLM-based agents** are a recent innovation and a hot topic in many industries. These agents are essentially
  systems built around LLMs that are *proactive* rather than *reactive*. By adding robust structures (memory, planning, profile, action)
  on top of an LLM functioning as the "brain," agents can solve problems *autonomously*.

  **Multi-agent systems** are systems that use multiple LLM-based agents to tackle more complex problems, especially those
  that would require a single agent to balance multiple objectives, tasks, beliefs, etc.

  **Unfortunately, agents and multi-agent systems inherit the black-box nature of LLMs**. This propagates the
  explainability crisis further. Currently, explainability methods are either **black-box** explainability, which studies
  a model from the outside, or **white-box** explainability, which studies a model from the inside. Of the two, white-box
  explainability is more revealing. 

  This project focuses on applying white-box explainability to multi-agent systems. 

  The contributions of this work are:
  1. A multi-agent simulator, providing a controlled environment to analyze anomalous behaviours.
  2. White-box explainability tools, used to analyze collected internal data.

  The pipeline of this project is shown below. Essentially, this project starts by simulating a scenario involving
  multiple agents and collecting the internal data within each agent's LLM.

  This data can be used with **linear probes, sparse autoencoders, and tuned lenses**, among others, to classify whether
  certain anomalous behaviours are present. 

  Overall, **this project aims to provide an integrated safety framework that helps address the explainability crisis.**
  

personal_explanation_markdown: >-
  I'm most interested in the methods of white-box explainability. For example, linear probes
  can (roughly) detect whether an agent is "thinking" deceptive thoughts before they act on them!

