id: "connect-four"
title: "Connect Four Minimax AI"
status: "Application and Arduino variants"
featured: false
collapsible: true

summary_markdown: >-
  A Connect Four opponent using minimax search, implemented in both
  software and physical Arduino-based forms.

description_markdown: |-
  I used Connect Four to explore adversarial search through a game with
  simple rules but a surprisingly large decision tree.

  Minimax is an artificial intelligence algorithm that's highly applicable to game theory.
  This project uses minimax as the backbone of the AI's decisions in a game of Connect Four
  developed using **Python's Pygame** library.

  The project includes software and Arduino variants, connecting the
  minimax algorithm with both an application interface and a physical
  implementation.

  It was a useful introduction to how evaluation functions shape
  apparently intelligent decisions.

personal_explanation_markdown: >-
  Connect Four made search feel concrete, especially for an abstract AI algorithm like 
  minimax. 

