summary_markdown: >-
  A web interface for constructing and configuring bots that automate mouse and keyboard interactions
  through a visual workflow.

description_markdown: |-
  This project was my very first coding project, back when I was in middle school!

  This web project allowed for configurable "bots," which are sets of mouse
  and keyboard actions. For example, one bot could be customized to open a new tab, type a query,
  open the first link, scroll to the bottom and read the information.

  I used **PyAutoGUI** in **Python**, along with **Django**, **HTML**, **JS**, and **CSS** for the app.

  This project helped me think about how interface structure can explain the
  technical system underneath it.

personal_explanation_markdown: >-
  My first coding project!

