summary_markdown: >-
  A moonshot proposal exploring whether biological robots could
  contribute to microplastic remediation.

description_markdown: |-
  For a consulting hackathon, my team explored **xenobots** as a possible
  future tool for addressing microplastic pollution.

  Xenobots are microscopic, computer-designed biological life forms that can be
  programmed to perform simple tasks. We proposed a moonshot concept that would use
  xenobots to collect microplastics from the ocean and transport them to a
  central location for removal.

  The project required us to integrate biology, engineering,
  environmental impact, and public communication.

