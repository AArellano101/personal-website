id: "anemometer"
title: "Anemometer"
status: "SOAR project"
featured: false

summary_markdown: >-
  A wind-direction sensor combining a custom PCB with
  3D-printed mechanical design.

description_markdown: |-
  During a rocket launch, extensive sensor data is required, including wind direction.
  This project combined sensor measurement, circuit design, PCB layout,
  and mechanical packaging in a single instrument designed to measure it.

  It was a useful exercise in designing a full system, including the mechanical, electrical, and software
  aspects. Like I said on the front page, I like complex systems. This project is one of them.

  I used **SolidWorks** for the CAD, **KiCad** for the electrical schematic and PCB, and **ESP-IDF** for the
  ESP32 firmware, written in **C**.

personal_explanation_markdown: >-
  This was one of my first projects to contain all aspects of a system: the mechanical design, hardware,
  and software.

contributions:
