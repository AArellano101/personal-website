status: "Personal project"
featured: false
collapsible: true

summary_markdown: >-
  A social media website built to explore full-stack development.

description_markdown: |-
  Inspire was a full-stack social media project in which I explored
  how users, posts, profiles, and interactions fit together inside a
  web application. The purpose of this app was to provide
  curated, inspirational content to any user.

  It helped me think about the application as a complex software system,
  with interface states, data, authentication, and user behaviour.

personal_explanation_markdown: >-
  Inspire helped me stop thinking of a website as a collection of pages. A
  social application only works when identity, data, interface state, and
  interaction rules remain coherent.

