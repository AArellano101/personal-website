id: "precisionfit"
title: "PrecisionFit"
status: "Personal project"
featured: true

summary_markdown: >-
  A computer-vision fitness assistant designed to recognize exercise
  movement and score its accuracy.

description_markdown: |-
  PrecisionFit was my attempt to build a personal AI trainer using
  computer vision.

  Using **OpenCV** and **MediaPipe**, PrecisionFit interprets
  body landmarks from video, identifies exercise movements, and translates
  the resulting measurements into a score using a **machine learning** model I
  trained.

  The interesting challenge wasn't simply detecting a pose, but figuring out
  how a pose could be used in a machine learning model.

  The project introduced me to machine learning, specifically **how to train a model**.
  I learned about **multilayer perceptrons**, **loss functions**, **gradient descent**, and proper
  ML practices. Of course, it isn't perfect, but it has set me up to stay curious about
  ML.

personal_explanation_markdown: >-
  I was interested in how machine learning models for computer vision worked. How does an ML model
  see something?

