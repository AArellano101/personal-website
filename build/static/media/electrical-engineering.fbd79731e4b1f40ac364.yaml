content:
  lead_markdown: >-
    I have always been interested in abstract concepts and concrete projects, but I've struggled to find a field 
    that combines these two. Uniquely enough, **electrical engineering** combines the two effortlessly, which
    is why I chose to major in this area. I also have a soft spot for software systems, which draws me toward **digital engineering**.

