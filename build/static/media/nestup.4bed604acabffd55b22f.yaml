description_markdown: |-
  Nestup gave me experience contributing to a shared application rather
  than building every part alone.

  Nestup was a social media application developed collaboratively over several
  months, inspired by platforms such as Instagram.

  Nestup was built using **Swift** in **Xcode**.


personal_explanation_markdown: >-
  Nestup was one of my first experiences building a larger application collaboratively.

