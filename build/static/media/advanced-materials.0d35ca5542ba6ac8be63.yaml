summary_markdown: >-
  Research involving electrospun nanofibres, nanofillers,
  characterization, and direct-ink-writing 3D bioprinting.

description_markdown: |-
  During a research internship, I worked with electrospinning and
  direct-ink-writing 3D bioprinting to study advanced materials fabrication
  and produced simulations for advanced chemical devices.

  I produced several cellulose acetate and nanofiller-based films, fine-tuned
  fabrication parameters, and supported materials characterization and
  literature review.

  In addition, I produced CFD simulations for solar evaporators, eco-friendly devices
  that use sunlight to turn water into vapour.

  The experience taught me that experimental research is often a long
  conversation between preparation, observation, failure, and revision.

personal_explanation_markdown: >-
  I valued what this experience taught me about research. By nature, research requires attention
  to detail, care, and patience.
  
